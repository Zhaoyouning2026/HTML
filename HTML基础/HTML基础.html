<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基础</title>
  </head>
  <body>
    <!-- 知识点1 -->
    <!-- HTML 标题（Heading）是通过<h1> - <h6> 标签来定义的。 -->
    <h1>这是一个标题</h1>
    <h2>这是一个标题</h2>
    <h3>这是一个标题</h3>
    <h4>这是一个标题</h4>
    <h5>这是一个标题</h5>
    <h6>这是一个标题</h6>
    
    <!-- 知识点2 -->
    <!-- HTML 段落（Paragraph）是通过<p> 标签来定义的。 -->
    <p>这是一个段落</p>
    <p>这是第二个段落</p>

    <!-- 知识点3 -->
    <!-- HTML 链接是通过标签 <a> 来定义的 -->
    <a href="https://www.baidu.com">这是一个链接</a>

    <!-- 知识点4 -->
    <!-- HTML 图片是通过标签 <img> 来定义的 -->
    <img src="https://www.baidu.com/img/PCtm_d9c8750bed0b3c7d089fa7d55720d6cf.png" alt="这是一个图片"/>
  </body>
</html>
